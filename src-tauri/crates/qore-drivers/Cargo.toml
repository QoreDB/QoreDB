[package]
name = "qore-drivers"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Database driver implementations for QoreCore"

[dependencies]
# Workspace crates
qore-core = { path = "../qore-core" }
qore-sql = { path = "../qore-sql" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
compact_str = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
async-trait = { workspace = true }
futures = { version = "0.3", optional = true }

# Logging
tracing = { workspace = true }

# IDs & encoding
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }

# Numeric precision
rust_decimal = { workspace = true }
bigdecimal = { workspace = true }

# Database drivers
sqlx = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
tiberius = { workspace = true, optional = true }
bb8 = { workspace = true, optional = true }
bb8-tiberius = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }

# HTTP-backed ClickHouse and search drivers
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json", "gzip"] }

# SOCKS5 proxy support
tokio-socks = "0.5"

# Regex (SSH tunnel validation)
regex = "1"

# Optional Tauri integration (health monitor emits Tauri events)
tauri = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3.24.0"

[features]
default = ["all-drivers"]
all-drivers = [
    "driver-azuresql",
    "driver-clickhouse",
    "driver-cockroachdb",
    "driver-doris",
    "driver-documentdb",
    "driver-dragonfly",
    "driver-duckdb",
    "driver-elasticsearch",
    "driver-garnet",
    "driver-keydb",
    "driver-mariadb",
    "driver-mongodb",
    "driver-motherduck",
    "driver-mysql",
    "driver-neon",
    "driver-opensearch",
    "driver-planetscale",
    "driver-postgres",
    "driver-redis",
    "driver-sqlite",
    "driver-sqlserver",
    "driver-starrocks",
    "driver-singlestore",
    "driver-supabase",
    "driver-synapse",
    "driver-tidb",
    "driver-timescaledb",
    "driver-valkey",
    "driver-yugabytedb",
]
driver-azuresql = ["driver-sqlserver"]
driver-clickhouse = ["dep:reqwest"]
driver-cockroachdb = ["sqlx-postgres"]
driver-doris = ["sqlx-mysql"]
driver-duckdb = ["dep:duckdb"]
driver-elasticsearch = ["dep:reqwest"]
driver-garnet = ["dep:futures", "dep:redis"]
driver-keydb = ["dep:futures", "dep:redis"]
driver-mariadb = ["sqlx-mysql"]
driver-documentdb = ["driver-mongodb"]
driver-dragonfly = ["dep:futures", "dep:redis"]
driver-mongodb = ["dep:futures", "dep:mongodb"]
driver-motherduck = ["sqlx-postgres"]
driver-mysql = ["sqlx-mysql"]
driver-neon = ["sqlx-postgres"]
driver-opensearch = ["dep:reqwest"]
driver-planetscale = ["sqlx-mysql"]
driver-postgres = ["sqlx-postgres"]
driver-redis = ["dep:futures", "dep:redis"]
driver-sqlite = ["dep:futures", "dep:sqlx", "sqlx/sqlite"]
driver-sqlserver = ["dep:bb8", "dep:bb8-tiberius", "dep:tiberius", "dep:tokio-util"]
driver-starrocks = ["sqlx-mysql"]
driver-singlestore = ["sqlx-mysql"]
driver-supabase = ["sqlx-postgres"]
driver-synapse = ["driver-sqlserver"]
driver-tidb = ["sqlx-mysql"]
driver-timescaledb = ["sqlx-postgres"]
driver-valkey = ["dep:futures", "dep:redis"]
driver-yugabytedb = ["sqlx-postgres"]
duckdb-bundled = ["driver-duckdb", "duckdb/bundled"]
sqlx-mysql = ["dep:futures", "dep:sqlx", "sqlx/mysql"]
sqlx-postgres = ["dep:futures", "dep:sqlx", "sqlx/postgres"]
tauri = ["dep:tauri"]
