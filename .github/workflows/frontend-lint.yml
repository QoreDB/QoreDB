name: Frontend Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test repository checks
        run: pnpm test:repo

      - name: Check documentation and source headers
        run: pnpm docs:check

      - name: Check TypeScript types
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test:ts

      - name: Run Biome check
        run: pnpm check
