name: Announce Release
on:
  release:
    types: [published, released, edited]

jobs:
  discord-announcement:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        uses: actions/github-script@v7
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const release = context.payload.release;
            const body = release.body.substring(0, 1500);

            // ID numérique du rôle "New releases" (Discord → Paramètres du serveur → Rôles → Copier l'ID)
            const RELEASES_ROLE_ID = "TON_ROLE_ID";

            const footer = "\n\n---\nQuestions or bugs? [Join the Discord](https://discord.gg/Yr6P3wuZDt) or open an issue.";

            const message = {
              content: `<@&${RELEASES_ROLE_ID}>`,
              allowed_mentions: { roles: [RELEASES_ROLE_ID] },
              embeds: [{
                title: `🚀 Nouvelle Release : ${release.tag_name}`,
                url: release.html_url,
                description: body + footer,
                color: 5814783,
                author: {
                  name: "QoreDB Updates",
                  icon_url: "https://github.com/github.png"
                },
                fields: [
                  { name: "Version", value: release.tag_name, inline: true },
                  { name: "Auteur", value: release.author.login, inline: true }
                ],
                timestamp: new Date().toISOString()
              }]
            };

            await fetch(process.env.WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(message)
            });
