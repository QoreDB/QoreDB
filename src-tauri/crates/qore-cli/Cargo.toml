[package]
name = "qore-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "qore"
path = "src/main.rs"

[dependencies]
qore-service = { path = "../qore-service", default-features = false }
qore-core = { path = "../qore-core" }
tokio = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
clap = { version = "4.6.1", features = ["derive"] }

[features]
default = ["all-drivers"]
all-drivers = ["qore-service/all-drivers"]
driver-clickhouse = ["qore-service/driver-clickhouse"]
driver-cockroachdb = ["qore-service/driver-cockroachdb"]
driver-duckdb = ["qore-service/driver-duckdb"]
driver-elasticsearch = ["qore-service/driver-elasticsearch"]
driver-mariadb = ["qore-service/driver-mariadb"]
driver-documentdb = ["qore-service/driver-documentdb"]
driver-dragonfly = ["qore-service/driver-dragonfly"]
driver-mongodb = ["qore-service/driver-mongodb"]
driver-motherduck = ["qore-service/driver-motherduck"]
driver-mysql = ["qore-service/driver-mysql"]
driver-neon = ["qore-service/driver-neon"]
driver-opensearch = ["qore-service/driver-opensearch"]
driver-planetscale = ["qore-service/driver-planetscale"]
driver-postgres = ["qore-service/driver-postgres"]
driver-redis = ["qore-service/driver-redis"]
driver-sqlite = ["qore-service/driver-sqlite"]
driver-sqlserver = ["qore-service/driver-sqlserver"]
driver-supabase = ["qore-service/driver-supabase"]
driver-timescaledb = ["qore-service/driver-timescaledb"]
driver-valkey = ["qore-service/driver-valkey"]
duckdb-bundled = ["driver-duckdb", "qore-service/duckdb-bundled"]
