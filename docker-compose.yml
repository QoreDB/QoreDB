services:
  ssh-bastion:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: qoredb-ssh-bastion
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=qoredb
      - PUBLIC_KEY_FILE=/config/ssh/authorized_keys
    ports:
      - '2222:2222'
    volumes:
      - ./dev/ssh:/config/ssh:ro
      - ./dev/ssh/sshd_config.d/10-qoredb-forwarding.conf:/config/sshd/sshd_config.d/10-qoredb-forwarding.conf:ro

  postgres:
    image: postgres:16-alpine
    container_name: qoredb-postgres
    environment:
      POSTGRES_USER: qoredb
      POSTGRES_PASSWORD: qoredb_test
      POSTGRES_DB: testdb
    ports:
      - '54321:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mysql:
    image: mysql:8
    container_name: qoredb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_test
      MYSQL_USER: qoredb
      MYSQL_PASSWORD: qoredb_test
      MYSQL_DATABASE: testdb
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    container_name: qoredb-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: qoredb
      MONGO_INITDB_ROOT_PASSWORD: qoredb_test
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  # DocumentDB is TLS-only and signed by an Amazon CA. This is a local stand-in:
  # a MongoDB requiring TLS, with a self-signed certificate generated at boot so
  # nothing sensitive is committed. `docker/mongodb-tls/ca.crt` is what the
  # connection form's CA field expects.
  mongodb-tls:
    image: mongo:7
    container_name: qoredb-mongodb-tls
    environment:
      MONGO_INITDB_ROOT_USERNAME: qoredb
      MONGO_INITDB_ROOT_PASSWORD: qoredb_test
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -f /tls/server.pem ]; then
          # A real chain, like DocumentDB's: a CA that signs a distinct server
          # certificate. A single self-signed certificate acting as both is
          # rejected by the TLS layer (CaUsedAsEndEntity).
          openssl req -x509 -newkey rsa:2048 -days 3650 -nodes \
            -keyout /tls/ca.key -out /tls/ca.crt \
            -subj '/CN=QoreDB Test CA' \
            -addext 'basicConstraints=critical,CA:TRUE'
          openssl req -newkey rsa:2048 -nodes \
            -keyout /tls/server.key -out /tls/server.csr \
            -subj '/CN=localhost'
          openssl x509 -req -in /tls/server.csr -days 3650 \
            -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial \
            -out /tls/server.crt \
            -extfile <(printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE')
          cat /tls/server.key /tls/server.crt > /tls/server.pem
          chmod 644 /tls/server.pem /tls/ca.crt
        fi
        exec docker-entrypoint.sh mongod \
          --tlsMode requireTLS \
          --tlsCertificateKeyFile /tls/server.pem \
          --tlsCAFile /tls/ca.crt \
          --tlsAllowConnectionsWithoutCertificates
    volumes:
      - ./docker/mongodb-tls:/tls
    ports:
      - '27018:27017'

  redis:
    image: redis:7-alpine
    container_name: qoredb-redis
    command: redis-server --requirepass qoredb_test
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: qoredb-dragonfly
    command: dragonfly --requirepass=qoredb_test --dbfilename=
    ulimits:
      memlock: -1
    ports:
      - '6380:6379'

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qoredb-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "QoreDB_Test123!"
    ports:
      - '1433:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: qoredb-clickhouse
    environment:
      CLICKHOUSE_USER: qoredb
      # No password: integration tests run over cleartext HTTP and the driver
      # refuses Basic-auth in cleartext (audit B4-C8). TLS isn't worth wiring
      # up for a local test container.
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_DB: testdb
    ports:
      - '8123:8123' # HTTP
      - '9000:9000' # native (unused by QoreDB but exposed for tooling)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: qoredb-elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - '9200:9200' # REST API
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: qoredb-opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - '9201:9200'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:
  sqlserver_data:
  clickhouse_data:
  elasticsearch_data:
  opensearch_data:
