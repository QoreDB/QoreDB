[package]
name = "qore-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Surface-agnostic service layer for QorePlatform — Tauri-free business logic shared by every surface (desktop, CLI, MCP, server)"

[dependencies]
qore-core = { path = "../qore-core" }
qore-sql = { path = "../qore-sql" }
qore-drivers = { path = "../qore-drivers", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { version = "2", features = ["serde"] }
regex = "1"
sha2 = "0.10"
csv = "1"
dirs = "5"
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[build-dependencies]
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3.24.0"

[features]
default = ["all-drivers"]
all-drivers = [
    "driver-azuresql",
    "driver-clickhouse",
    "driver-cockroachdb",
    "driver-doris",
    "driver-documentdb",
    "driver-dragonfly",
    "driver-duckdb",
    "driver-elasticsearch",
    "driver-garnet",
    "driver-keydb",
    "driver-mariadb",
    "driver-mongodb",
    "driver-motherduck",
    "driver-mysql",
    "driver-neon",
    "driver-opensearch",
    "driver-planetscale",
    "driver-postgres",
    "driver-redis",
    "driver-sqlite",
    "driver-sqlserver",
    "driver-singlestore",
    "driver-starrocks",
    "driver-supabase",
    "driver-synapse",
    "driver-tidb",
    "driver-timescaledb",
    "driver-valkey",
    "driver-yugabytedb",
]
driver-azuresql = ["qore-drivers/driver-azuresql"]
driver-clickhouse = ["qore-drivers/driver-clickhouse"]
driver-cockroachdb = ["qore-drivers/driver-cockroachdb"]
driver-doris = ["qore-drivers/driver-doris"]
driver-duckdb = ["qore-drivers/driver-duckdb"]
driver-elasticsearch = ["qore-drivers/driver-elasticsearch"]
driver-garnet = ["qore-drivers/driver-garnet"]
driver-keydb = ["qore-drivers/driver-keydb"]
driver-mariadb = ["qore-drivers/driver-mariadb"]
driver-documentdb = ["qore-drivers/driver-documentdb"]
driver-dragonfly = ["qore-drivers/driver-dragonfly"]
driver-mongodb = ["qore-drivers/driver-mongodb"]
driver-motherduck = ["qore-drivers/driver-motherduck"]
driver-mysql = ["qore-drivers/driver-mysql"]
driver-neon = ["qore-drivers/driver-neon"]
driver-opensearch = ["qore-drivers/driver-opensearch"]
driver-planetscale = ["qore-drivers/driver-planetscale"]
driver-postgres = ["qore-drivers/driver-postgres"]
driver-redis = ["qore-drivers/driver-redis"]
driver-sqlite = ["qore-drivers/driver-sqlite"]
driver-sqlserver = ["qore-drivers/driver-sqlserver"]
driver-singlestore = ["qore-drivers/driver-singlestore"]
driver-starrocks = ["qore-drivers/driver-starrocks"]
driver-supabase = ["qore-drivers/driver-supabase"]
driver-synapse = ["qore-drivers/driver-synapse"]
driver-tidb = ["qore-drivers/driver-tidb"]
driver-timescaledb = ["qore-drivers/driver-timescaledb"]
driver-valkey = ["qore-drivers/driver-valkey"]
driver-yugabytedb = ["qore-drivers/driver-yugabytedb"]
duckdb-bundled = ["driver-duckdb", "qore-drivers/duckdb-bundled"]
