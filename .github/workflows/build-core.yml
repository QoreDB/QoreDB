name: Build & Test (Core)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: "core"

      - name: Ensure the DuckDB prebuilt library is present
        run: |
          cd src-tauri
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            rm -rf target/*/.fingerprint/libduckdb-sys-* target/*/build/libduckdb-sys-*
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gnome-keyring \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libkrb5-dev

      - name: Start database containers
        run: docker compose up -d postgres mysql mongodb mongodb-tls dragonfly

      - name: Wait for databases
        run: |
          set -e
          wait_for() {
            local name="$1"
            shift
            for _ in $(seq 1 30); do
              if "$@"; then
                echo "$name ready"
                return 0
              fi
              sleep 1
            done
            echo "$name failed to start"
            return 1
          }

          wait_for postgres docker compose exec -T postgres pg_isready -U qoredb -d testdb
          wait_for mysql docker compose exec -T mysql mysqladmin ping -uroot -proot_test --silent
          wait_for mongodb docker compose exec -T mongodb mongosh -u qoredb -p qoredb_test --authenticationDatabase admin --quiet --eval "db.runCommand({ ping: 1 })"
          wait_for dragonfly docker compose exec -T dragonfly redis-cli -a qoredb_test --no-auth-warning ping
          wait_for mongodb-tls docker compose exec -T mongodb-tls mongosh --tls --tlsCAFile /tls/ca.crt -u qoredb -p qoredb_test --authenticationDatabase admin --quiet --eval "db.runCommand({ ping: 1 })"

      - name: Run Core tests (no feature flags)
        env:
          RUST_TEST_THREADS: 1
          QOREDB_TEST_POSTGRES_REQUIRED: "true"
          QOREDB_TEST_MYSQL_REQUIRED: "true"
          QOREDB_TEST_MONGO_REQUIRED: "true"
          QOREDB_TEST_DRAGONFLY_REQUIRED: "true"
          QOREDB_TEST_PLANETSCALE_REQUIRED: "true"
          QOREDB_TEST_DOCUMENTDB_REQUIRED: "true"
          PUBLIC_KEY_BASE64: ${{ vars.PUBLIC_KEY_BASE64 }}
        run: |
          dbus-run-session -- bash -c "cd src-tauri && cargo test"

      - name: Verify Core build compiles
        env:
          PUBLIC_KEY_BASE64: ${{ vars.PUBLIC_KEY_BASE64 }}
        run: cd src-tauri && cargo build && cargo build -p qore-mcp -p qore-cli

      - name: Shutdown containers
        if: always()
        run: docker compose down -v
